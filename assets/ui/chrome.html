<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flash Browser</title>
<link rel="stylesheet" href="/ui/chrome.css">
</head>
<body>
<div id="app" class="app">
  <header id="titlebar" class="titlebar">
    <div id="brand" class="brand" title="Flash Browser">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M13.2 2 5 14h5.6L9.6 22 19 9.6h-5.8L13.2 2Z" fill="currentColor"/>
      </svg>
    </div>

    <div id="tabs" class="tabs" role="tablist"></div>

    <button id="newtab" class="newtab" type="button" title="新建标签页 (Ctrl+T)">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>

    <div id="dragspace" class="dragspace"></div>

    <div class="window-controls">
      <button id="win-min" class="win-btn" type="button" title="最小化">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 8h10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="win-max" class="win-btn" type="button" title="最大化">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <rect x="2.7" y="2.7" width="10.6" height="10.6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/>
        </svg>
      </button>
      <button id="win-close" class="win-btn close" type="button" title="关闭">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="toolbar" class="toolbar">
    <div class="nav-group">
      <button id="nav-back" class="icon-btn" type="button" title="后退 (Alt+←)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="nav-forward" class="icon-btn" type="button" title="前进 (Alt+→)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="nav-reload" class="icon-btn" type="button" title="重新加载 (F5)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 11.5a8 8 0 1 1-2.3-5.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          <path d="M20 4.5v6h-6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="nav-home" class="icon-btn" type="button" title="主页 (Alt+Home)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 11 12 3.5l8.5 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5.5 9.8V20h13V9.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <form id="omnibox" class="omnibox" autocomplete="off">
      <span class="site-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <ellipse cx="12" cy="12" rx="3.8" ry="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M3.8 12h16.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
        </svg>
      </span>
      <input id="address" type="text" spellcheck="false" autocomplete="off"
             placeholder="搜索或输入网址，也可打开本地 .swf 文件">
      <button id="go" type="submit" title="打开">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3.5 8h8.5M8.5 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>

    <div id="status" class="status-pill">
      <span class="dot"></span>
      <span id="status-text">Flash</span>
    </div>

    <button id="openfile" class="icon-btn" type="button" title="打开文件 (Ctrl+O)">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v8A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-10Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      </svg>
    </button>

    <button id="menu" class="icon-btn" type="button" title="菜单">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="5.5" r="1.7" fill="currentColor"/>
        <circle cx="12" cy="12" r="1.7" fill="currentColor"/>
        <circle cx="12" cy="18.5" r="1.7" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <div id="progress" class="progress"><span></span></div>
</div>

<script src="/qwebchannel.js"></script>
<script src="/ui/chrome.js"></script>
</body>
</html>
